# Gardrop reverse-proxy — Next.js storefront (:3000) + .NET API (:3001) + köhnə panellər (статik).
# /etc/nginx/sites-available/gardrop → symlink sites-enabled. HTTPS üçün certbot (aşağıda qeyd).

upstream gardrop_next { server 127.0.0.1:3000; }
upstream gardrop_api  { server 127.0.0.1:3001; }

server {
    listen 80;
    server_name gardrop.az www.gardrop.az;

    client_max_body_size 160M;   # şəkil upload (8×15MB)

    # ── Köhnə panellər (Vite статik build) — auth arxası, SEO lazım deyil ──
    location = /admin.html  { root /var/www/gardrop-panels; try_files /admin.html =404; }
    location = /magaza.html { root /var/www/gardrop-panels; try_files /magaza.html =404; }
    location /assets/       { root /var/www/gardrop-panels; access_log off; expires 30d; }

    # ── .NET API + upload faylları ──
    location /api/ {
        proxy_pass http://gardrop_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        proxy_pass http://gardrop_api;
        expires 30d;
        access_log off;
    }

    # ── Next.js storefront (SSR/ISR) — bütün qalan yollar ──
    location / {
        proxy_pass http://gardrop_next;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS: sudo certbot --nginx -d gardrop.az -d www.gardrop.az
# certbot 443 server bloku + HTTP→HTTPS redirect avtomatik əlavə edir.
